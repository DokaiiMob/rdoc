<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 13px/1.4 system-ui, sans-serif;
      margin: 0;
      min-width: 220px;
      padding: 12px;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: #555; }
    button {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: #0b6e4f;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { margin-top: 8px; font-size: 12px; min-height: 1.2em; }
    .err { color: #b00020; }
    .ok { color: #0b6e4f; }
  </style>
</head>
<body>
  <h1>Save as .rdoc</h1>
  <p>Pack this page into an offline <code>.rdoc.html</code>.</p>
  <button type="button" id="save">Save as .rdoc</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
