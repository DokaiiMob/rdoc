plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envStoreFile = System.getenv('RDOC_KEYSTORE_FILE')
def hasReleaseSigning = keystorePropertiesFile.exists() ||
        (envStoreFile != null && !envStoreFile.trim().isEmpty())

android {
    namespace 'com.rdoc.reader'
    compileSdk 35

    defaultConfig {
        applicationId "com.rdoc.reader"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else if (envStoreFile != null && !envStoreFile.trim().isEmpty()) {
                keyAlias System.getenv('RDOC_KEY_ALIAS')
                keyPassword System.getenv('RDOC_KEY_PASSWORD')
                storeFile file(envStoreFile)
                storePassword System.getenv('RDOC_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
}
